name: Deploy frontend to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate required GitHub variables
        env:
          API_BASE: ${{ vars.API_BASE }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          test -n "$API_BASE" || { echo "::error::Variable API_BASE belum diisi."; exit 1; }
          test -n "$TURNSTILE_SITE_KEY" || { echo "::error::Variable TURNSTILE_SITE_KEY belum diisi."; exit 1; }

      - name: Generate frontend configuration
        env:
          API_BASE: ${{ vars.API_BASE }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          api = os.environ["API_BASE"].rstrip("/")
          key = os.environ["TURNSTILE_SITE_KEY"]
          content = "window.APP_CONFIG=" + json.dumps({
              "API_BASE": api,
              "TURNSTILE_SITE_KEY": key,
          }, separators=(",", ":")) + ";\n"
          Path("frontend/config.js").write_text(content, encoding="utf-8")
          PY

      - name: Validate frontend JavaScript and generated config
        run: |
          set -euo pipefail
          node --check frontend/app.js
          node --check frontend/admin.js
          node --check frontend/config.js
          ! grep -R "__API_BASE__\|__TURNSTILE_SITE_KEY__" frontend

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
